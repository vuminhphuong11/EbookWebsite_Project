<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký - App Đọc Sách</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">BookApp</a>
    </header>

    <div class="auth-container">
        <h2>Đăng Ký Tài Khoản</h2>
        <form action="login.html">
            <div class="form-group">
                <label for="fullname">Họ và tên</label>
                <input type="text" id="fullname" required placeholder="Nhập họ và tên...">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Nhập email...">
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" required placeholder="Tạo mật khẩu...">
            </div>
            <div class="form-group">
                <label for="confirm-password">Xác nhận mật khẩu</label>
                <input type="password" id="confirm-password" required placeholder="Nhập lại mật khẩu...">
            </div>
            <button type="submit" class="btn" style="width: 100%; background-color: #2ecc71;">Đăng Ký</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">
            Đã có tài khoản? <a href="login.html" style="color: #3498db;">Đăng nhập ngay</a>
        </p>
    </div>
</body>
</html>
