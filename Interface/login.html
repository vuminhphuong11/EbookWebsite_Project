<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">BookApp</a>
    </header>

    <div class="auth-container">
        <h2>Đăng Nhập</h2>
        <form action="index.html">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Nhập email...">
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" required placeholder="Nhập mật khẩu...">
            </div>
            <button type="submit" class="btn" style="width: 100%;">Đăng Nhập</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">
            Chưa có tài khoản? <a href="register.html" style="color: #3498db;">Đăng ký</a>
        </p>
    </div>
</body>
</html>
